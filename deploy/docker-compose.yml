# ikantvs — 宝塔只需这一份 compose（无需下载源码 / 无需 build）
#
# 用法：
#   1. 宝塔 Docker → 编排 → 添加 → 粘贴本文件
#   2. 同目录建 .env（可从仓库 .env.example 复制）改密码 / JWT / CORS
#      或在编排环境变量里填同名项
#   3. 启动。首次会 pull 镜像并自动建表。
#
# 端口：IP:3080 前台 · IP:3081 后台（admin / admin123，务必改密）
#
# 镜像：ghcr.io/kidoneself/ikantvs（含后端+前台+后台+建表 SQL）

services:
  mysql:
    image: mysql:8.0
    container_name: jyinshi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: jyinshi_next
      MYSQL_USER: ${DB_USERNAME:-jyinshi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-db}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --binlog-expire-logs-seconds=604800
    networks:
      - jyinshi-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: jyinshi-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    networks:
      - jyinshi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  # 搜链；内存紧可删掉本服务，并设 ENABLE_PANSOU=false / INGEST_PANSOU_ENABLED=false
  pansou:
    image: ghcr.io/fish2018/pansou-web:latest
    container_name: jyinshi-pansou
    restart: unless-stopped
    environment:
      CHANNELS: ${PANSOU_CHANNELS:-tgsearchers7,Aliyun_4K_Movies,bdbdndn11,yunpanx,bsbdbfjfjff,yp123pan,sbsbsnsqq,yunpanxunlei,tianyifc,BaiduCloudDisk,txtyzy,peccxinpd,gotopan,PanjClub,kkxlzy,baicaoZY,MCPH01,bdwpzhpd,ysxb48,jdjdn1111,yggpan,MCPH086,zaihuayun,Q66Share,Oscar_4Kmovies,ucwpzy,shareAliyun,alyp_1,dianyingshare,Quark_Movies,XiangxiuNBB,ydypzyfx,ucquark,xx123pan,yingshifenxiang123,zyfb123,tyypzhpd,tianyirigeng,cloudtianyi,hdhhd21,Lsp115,oneonefivewpfx,qixingzhenren,taoxgzy,Channel_Shares_115,tyysypzypd,vip115hot,wp123zy,yunpan139,yunpan189,yunpanuc,yydf_hzl,leoziyuan,pikpakpan,Q_dongman,yoyokuakeduanju}
      ENABLED_PLUGINS: ${PANSOU_PLUGINS:-labi,zhizhen,shandian,duoduo,muou}
      CACHE_TTL: ${PANSOU_CACHE_TTL:-60}
    volumes:
      - pansou_cache:/app/data/cache
    mem_limit: 1g
    networks:
      - jyinshi-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

  db-init:
    image: ${APP_IMAGE:-ghcr.io/kidoneself/ikantvs:latest}
    container_name: jyinshi-db-init
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: jyinshi_next
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - jyinshi-net
    entrypoint: ["/bin/sh", "/opt/ikantvs/db-init.sh"]

  app:
    image: ${APP_IMAGE:-ghcr.io/kidoneself/ikantvs:latest}
    container_name: jyinshi-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/jyinshi_next?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-jyinshi}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-random-secret-at-least-32-bytes}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      CORS_ENFORCE_ORIGIN: ${CORS_ENFORCE_ORIGIN:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3080}
      PANSOU_BASE: ${PANSOU_BASE:-http://pansou}
      XUNLEI_REDIRECT_URI: ${XUNLEI_REDIRECT_URI:-}
      JYINSHI_CLOUD_ENABLED: ${JYINSHI_CLOUD_ENABLED:-false}
      JYINSHI_CLOUD_BASE_URL: ${JYINSHI_CLOUD_BASE_URL:-}
      JYINSHI_CLOUD_API_KEY: ${JYINSHI_CLOUD_API_KEY:-}
      INGEST_ENABLED: ${INGEST_ENABLED:-true}
      INGEST_PANSOU_ENABLED: ${INGEST_PANSOU_ENABLED:-true}
      QUARK_RANKING_ENABLED: ${QUARK_RANKING_ENABLED:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ENABLE_PANSOU: ${ENABLE_PANSOU:-true}
      R2_ENABLED: ${R2_ENABLED:-false}
    ports:
      - "3080:80"
      - "3081:81"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - jyinshi-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  jyinshi-net:
    driver: bridge

volumes:
  mysql_data:
  pansou_cache:
